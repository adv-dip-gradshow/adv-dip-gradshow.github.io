<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./assets/css/output.css" rel="stylesheet" />
    <title>2026 Grad Show</title>
    <meta
      name="description"
      content="North Metro TAFE's Game Art and Animation graduates of 2026!"
    />
    <script
      src="https://kit.fontawesome.com/95b9a3e4af.js"
      crossorigin="anonymous"
    ></script>
    <script>
      function galleryView(img) {
        //get the element of the expanded image
        let expandedImg = document.getElementById("expandedImg");

        // assign the src of the image being clicked on to the expanded image
        expandedImg.src = img.src;

        //show the container element
        expandedImg.parentElement.style.display = "flex";
      }

      function hideParentElement(child) {
        const element = child.parentElement;
        element.style.display = "none";
      }
    </script>
  </head>

  <body class="flex min-h-dvh flex-col justify-between">
    <!--TITLE BAR-->
    <header>
      <div class="bg-black h-40">
        <img class="max-h-full mx-auto" src="assets/images/graphics/NXTPhasePattern_Stroke.png" alt="">
        <a href="index.html" class="absolute top-5 left-5"
          ><i class="fa-solid fa-arrow-left text-white text-lg"></i>
        </a>
      </div>
      <div class="h-10 bg-[url(/assets/images/graphics/bg_halftone.png)] bg-repeat-x bg-center min-h-10"></div>
    </header>

    <main id="pageMain" class="mx-auto w-full min-h-svh bg-[url(/assets/images/graphics/NXTPhasePattern_PNG2.png)] bg-repeat"></main>

    <!--Gallery image viewer-->
    <div
      class="fixed inset-0 hidden h-dvh w-full flex-col justify-center bg-black/25"
      onclick="this.style.display = 'none'"
    >
      <!--actual image-->
      <img
        id="expandedImg"
        class="mx-auto aspect-auto max-h-3/4 max-w-3/4 md:max-w-1/2"
      />
    </div>
    <br />
        <footer class="static inset-x-0 bottom-0 h-30 bg-black">
            <section class="py-4">
                <p class="text-white text-center"><a class="underline" href="index.html">Home</a> | Web design by Eliot Barton. Graphics by KyosArtworks. All content property of the respective artist.</p>
            </section>
        </footer>
  </body>
  <script type="module" src="assets/js/utils/studentPage.js"></script>
</html>
